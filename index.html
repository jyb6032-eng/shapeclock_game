<title>모양 시각 수비대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen game app. Night-sky "똑딱 마을" world; HUD band on top, play stage fills the rest; map is a winding board path. Single deliberate look in both themes. */
:root{
  --night:#1e1457; --dusk:#3a2bb0; --gold:#ffcf3a; --gold-d:#d98a00; --pink:#ff5fa2; --pink-d:#c42a6f;
  --mint:#22d3a5; --sky:#4fb3ff; --sky-d:#1f78c4; --paper:#fff8ec; --ink:#24184d; --muted:#6c6496;
  --ok:#19b46a; --bad:#ef4b4b; --hr:#ff4d4d; --mn:#2f7bff;
  --head:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --emo:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--head);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--head);cursor:pointer;touch-action:manipulation}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%, #4b39c9 0%, #2a1d8a 45%, var(--night) 100%)}
#bg i{position:absolute;opacity:.16;animation:drift linear infinite}
#app{position:relative;z-index:1;height:100%;overflow:auto;max-width:1120px;margin:0 auto}
.scr{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px}

/* buttons */
.btn{font-size:clamp(18px,2.3vw,23px);border:0;border-radius:999px;padding:.5em 1.15em;color:var(--ink);
  background:linear-gradient(#ffe68a,var(--gold));box-shadow:0 6px 0 var(--gold-d),0 10px 18px rgba(0,0,0,.25);
  display:inline-flex;align-items:center;justify-content:center;gap:.35em;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gold-d),0 4px 8px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#8fd1ff,var(--sky));box-shadow:0 6px 0 var(--sky-d),0 10px 18px rgba(0,0,0,.25);color:#0b2350}
.btn.pink{background:linear-gradient(#ff9cc8,var(--pink));box-shadow:0 6px 0 var(--pink-d),0 10px 18px rgba(0,0,0,.25);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.3)}
.btn.big{font-size:clamp(22px,3vw,30px);padding:.55em 1.5em}
.btn.sm{font-size:17px;padding:.38em .85em}
.btn:focus-visible,.node:focus-visible,.opt:focus-visible,.copt:focus-visible,.bopt:focus-visible{outline:4px solid #fff;outline-offset:3px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding-bottom:8px}
.say-btn{border:0;background:var(--sky);color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px;flex:none;box-shadow:0 4px 0 var(--sky-d)}
.say-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-d)}
.ch svg,.av svg,.t-boss svg,.res-ch svg,.c-seal svg,#bg i svg{width:100%;height:auto;display:block;overflow:visible}

/* title */
.title-scr{justify-content:center;align-items:center;text-align:center;gap:18px;position:relative}
.logo{margin:0;font-weight:400;font-size:clamp(50px,10.5vw,112px);line-height:.98;color:var(--gold);letter-spacing:.01em;
  -webkit-text-stroke:4px #4a1f9e;paint-order:stroke fill;text-shadow:0 6px 0 #4a1f9e,0 12px 0 rgba(0,0,0,.25);text-wrap:balance}
.logo small{display:block;font-size:.3em;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 #4a1f9e;margin-bottom:.35em;letter-spacing:.06em}
.logo .dot{color:var(--pink)}
.t-heroes{display:flex;gap:clamp(6px,2vw,22px);align-items:flex-end;justify-content:center}
.t-heroes .ch{width:clamp(64px,13vw,124px);animation:hop 1.4s ease-in-out infinite}
.t-heroes .ch:nth-child(2){animation-delay:.18s}.t-heroes .ch:nth-child(3){animation-delay:.36s}.t-heroes .ch:nth-child(4){animation-delay:.54s}
.t-boss{position:absolute;right:2%;top:4%;width:clamp(70px,13vw,130px);animation:peek 3s ease-in-out infinite;opacity:.95}
.t-sub{color:#cfc8ff;font-family:var(--body);font-size:18px;margin:0}

/* top bars */
.gbar,.mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.tool-music[aria-pressed="false"]{opacity:.65}
.title-tools{position:absolute;top:8px;left:0;z-index:2}
.tg select{font-family:var(--head);font-size:16px;max-width:62%;border:2px solid #d7c9f5;border-radius:12px;padding:4px 8px;background:#fff;color:var(--ink)}
.gbar h2{margin:0;color:#fff;font-weight:400;font-size:clamp(20px,2.8vw,28px);text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.3);min-width:0}

/* map */
.rank{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:22px;padding:8px 14px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.rank .r-ic{font-size:40px;font-family:var(--emo);line-height:1}
.rank .r-in{flex:1;min-width:0}
.rank b{font-size:22px;font-weight:400}
.rank small{display:block;color:var(--muted);font-family:var(--body);font-size:15px;font-weight:700}
.rbar{height:12px;background:#e7e0ff;border-radius:99px;overflow:hidden;margin:4px 0}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold))}
.board{position:relative;flex:1;min-height:440px;border-radius:30px;overflow:hidden;
  background:radial-gradient(60% 50% at 20% 80%, #7fe0a0 0 60%, transparent 61%),radial-gradient(50% 40% at 85% 30%, #7fe0a0 0 60%, transparent 61%),linear-gradient(#5ec6ff,#a6e3ff 55%,#8bd67e 55%,#5fbf63);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.35)}
.board::before{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.08) 60px 62px)}
.route{position:absolute;inset:0;width:100%;height:100%}
.route polyline{fill:none;stroke:#fff8ec;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route polyline.dash{stroke:#e0a85a;stroke-width:4;stroke-dasharray:10 12}
.node{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:clamp(86px,15vw,130px)}
.n-ic{width:clamp(62px,9vw,88px);aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.25);position:relative;font-size:clamp(30px,4.5vw,44px);font-family:var(--emo)}
.n-ic svg{width:74%;height:74%}
.node.done .n-ic{border-color:var(--gold)}
.node.boss .n-ic{background:#3d1a87;border-color:var(--pink)}
.node.next .n-ic{animation:hop 1s ease-in-out infinite;box-shadow:0 0 0 6px rgba(255,207,58,.6),0 6px 0 rgba(0,0,0,.25)}
.n-num{position:absolute;top:-8px;right:-12px;background:var(--pink);color:#fff;border-radius:99px;font-size:16px;min-width:28px;height:28px;display:grid;place-items:center;box-shadow:0 3px 0 var(--pink-d)}
.n-lb{background:var(--ink);color:#fff;border-radius:10px;padding:2px 8px;font-size:clamp(14px,1.8vw,17px);white-space:nowrap}
.n-st{color:rgba(36,24,77,.35);font-size:20px;letter-spacing:1px;line-height:1;-webkit-text-stroke:1px rgba(255,255,255,.7)}
.n-st .on{color:var(--gold);-webkit-text-stroke:1px var(--gold-d)}
.flag{position:absolute;top:-30px;background:var(--pink);color:#fff;border-radius:10px;padding:2px 10px;font-size:18px;animation:wig .5s ease-in-out infinite alternate;box-shadow:0 3px 0 var(--pink-d)}

/* story */
.story-scr{height:100%}
.scene{position:relative;flex:1;min-height:200px;border-radius:30px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:3%;padding:0 4% 5%;
  background:radial-gradient(30% 22% at 80% 22%, #fff7c2 0 40%, transparent 41%),linear-gradient(#7fd0ff,#cdeeff 62%,#8fdc84 62%,#5cbf60)}
.scene.dark{background:radial-gradient(40% 30% at 50% 30%, #8c55ff55, transparent),linear-gradient(#2a0f63,#4d1f9e 62%,#3b1680 62%,#28105a)}
.scene .ch{width:clamp(76px,15vw,160px);transition:transform .3s,filter .3s;filter:saturate(.55) brightness(.85)}
.scene .ch.on{transform:translateY(-14px) scale(1.12);filter:none;animation:talk .45s ease-in-out infinite alternate}
.talk{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:26px;padding:12px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.av{width:clamp(56px,8vw,78px);flex:none}
.tx{flex:1;min-width:0}
.who{font-size:17px;color:#fff;background:var(--ink);border-radius:8px;padding:1px 8px}
.say{margin:6px 0 0;font-size:clamp(21px,2.7vw,29px);line-height:1.45;min-height:2.9em}
.say.typing::after{content:"▌";color:var(--pink);animation:blink .6s steps(1) infinite}

/* game frame */
.game-scr{height:100%}
.groot{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.hud{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:20px;padding:8px 14px;color:#fff;font-size:22px}
.h-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hearts{font-family:var(--emo);font-size:22px;letter-spacing:1px;white-space:nowrap}
.hearts.hurt{animation:shake .35s}
.prog{display:flex;gap:5px}
.prog i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25)}
.prog i.cur{box-shadow:0 0 0 3px #fff}
.prog i.ok{background:var(--mint)} .prog i.no{background:var(--bad)}
.tbar{flex:1;height:22px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden;position:relative}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .2s linear}
.tbar.low i{background:var(--bad)}
.tbar b{position:absolute;inset:0;display:grid;place-items:center;font-weight:400;font-size:16px;text-shadow:0 1px 2px #000}
.h-sp{flex:1}
.h-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.combo{background:var(--pink);border-radius:99px;padding:2px 12px;font-size:18px;box-shadow:0 3px 0 var(--pink-d)}
.combo:empty{display:none}
.combo.bump,.score.bump{animation:bump .25s}
.score{font-size:30px;color:var(--gold);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.score::before{content:"⭐ ";font-size:.7em;font-family:var(--emo)}
.stage{position:relative;flex:1;min-height:440px;border-radius:26px;overflow:hidden;background:#2b1f7a;display:flex;flex-direction:column}
.stage.shake{animation:shake .35s}
.stage.fever{box-shadow:0 0 0 5px #fff,0 0 34px 10px var(--pink);animation:fever 1.2s linear infinite}
.fever-badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;z-index:15;background:linear-gradient(90deg,#ff5fa2,#ffcf3a,#22d3a5,#4fb3ff);color:#fff;border-radius:99px;padding:4px 16px;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap;pointer-events:none}
.stage.fever .fever-badge{display:block;animation:wiggle .35s infinite alternate}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,10,60,.6);z-index:20;padding:16px}
.card{background:var(--paper);border-radius:28px;padding:20px 24px;box-shadow:0 10px 0 rgba(0,0,0,.25);text-align:center;max-width:560px;width:100%}
.intro .i-ic{font-size:64px;font-family:var(--emo);line-height:1}
.intro h2{margin:6px 0 10px;font-weight:400;font-size:34px}
.intro ul{text-align:left;margin:0 0 16px;padding:0 0 0 1.2em;font-size:clamp(19px,2.4vw,23px);line-height:1.6}
.count{font-size:150px;color:#fff;-webkit-text-stroke:5px var(--pink-d);paint-order:stroke fill;animation:cpop .7s ease-out}
.endbanner{font-size:clamp(48px,9vw,90px);color:var(--gold);-webkit-text-stroke:5px #4a1f9e;paint-order:stroke fill;animation:cpop .6s ease-out}
.endbanner.fail{color:#fff}

/* game 1: find */
.st-find{background:linear-gradient(#8fe0ff,#c8f0ff 30%,#8fdc84 30%,#56b95a)}
.fd{display:flex;flex-direction:column;flex:1;min-height:0}
.target{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px;background:var(--paper);margin:12px 12px 8px;border-radius:20px;font-size:clamp(22px,3.2vw,34px);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.target .t-ic{width:56px;height:56px;flex:none}
.target .t-ic svg{width:100%;height:100%}
.target b{font-weight:400}
.target.swap{animation:cpop .5s}
.holes{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;padding:4px 12px 14px}
.hole{position:relative;border-radius:50%;background:radial-gradient(ellipse 60% 22% at 50% 88%, rgba(40,25,10,.55), rgba(40,25,10,.12) 70%, transparent 72%)}
.item{position:absolute;inset:4% 10% 12%;border:0;background:none;padding:0;display:grid;place-items:center;animation:rise .28s cubic-bezier(.3,1.6,.6,1) both}
.item .emo{font-family:var(--emo);font-size:clamp(42px,7vw,76px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.item svg{width:84%;height:84%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.item.hit{animation:hitpop .3s forwards}
.item.miss{animation:nope .45s}
.item.out{animation:sink .25s forwards}

/* game 2: rocket */
.st-rocket{background:#120b3d}
.rk{display:flex;flex-direction:column;flex:1;min-height:0}
.riddle{margin:12px 12px 6px;background:var(--paper);border-radius:20px;padding:8px 14px;display:flex;gap:12px;align-items:center;min-height:72px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.riddle p{margin:0;font-size:clamp(21px,3vw,32px);line-height:1.3}
.riddle p.new{animation:cpop .45s}
.track{position:relative;flex:1;overflow:hidden;margin:0 12px;border-radius:20px;
  background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 85%,#fff,transparent),radial-gradient(2px 2px at 85% 15%,#fff,transparent),linear-gradient(#1a0f52,#3b25a8);
  background-size:180px 180px,220px 220px,160px 160px,240px 240px,100% 100%;animation:space 2.5s linear infinite}
.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.lanes i{border-right:3px dashed rgba(255,255,255,.18)} .lanes i:last-child{border:0}
.gate{position:absolute;left:0;right:0;top:0;height:clamp(96px,22%,150px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 8px;will-change:transform}
.gate .cell{background:rgba(255,255,255,.94);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:5px solid #fff;transition:transform .2s,background .2s}
.gate .cell svg{height:62%;width:auto}
.gate .cell b{font-weight:400;font-size:clamp(15px,2vw,20px)}
.gate .cell.good{background:#c9ffe6;border-color:var(--mint);transform:scale(1.08)}
.gate .cell.bad{background:#ffd0d0;border-color:var(--bad)}
.gate.gone{opacity:0;transition:opacity .3s}
.rocket{position:absolute;bottom:3%;left:0;width:calc(100%/3);height:clamp(84px,18%,130px);display:grid;place-items:center;transition:transform .16s ease-out;z-index:3;pointer-events:none}
.rocket svg{height:100%;width:auto}
.rocket .flame{animation:flame .12s infinite alternate;transform-origin:30px 86px}
.rocket.boost svg{animation:boost .6s}
.rocket.crash svg{animation:crash .6s}
.coin{position:absolute;top:0;width:calc(100%/3);text-align:center;font-size:46px;font-family:var(--emo);line-height:1;will-change:transform;z-index:2}
.ctrl{display:flex;justify-content:space-between;gap:12px;padding:10px 12px 12px}
.ctrl .btn{flex:1;font-size:34px;padding:.25em}

/* game 3: count */
.st-count{background:linear-gradient(#ffe2f0,#ffd0e6)}
.cnt{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:12px;padding:12px;min-height:0}
.pic{background:#fff;border-radius:22px;display:grid;place-items:center;padding:8px;box-shadow:0 5px 0 rgba(0,0,0,.12);min-height:0}
.pic svg{width:100%;height:100%;max-height:58vh}
.pc{cursor:pointer}
.pc.chk>*{stroke:#ff2f7a;stroke-width:6}
.pc.flash>*{animation:flashstroke .5s 3}
.side{display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
.qbox{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:20px;padding:10px 14px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.qbox p{margin:0;font-size:clamp(21px,2.8vw,30px);line-height:1.35}
.qbox .mini{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.2em}
.qbox .mini svg{width:100%;height:100%}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opt{width:clamp(84px,11vw,110px);aspect-ratio:1;border:0;border-radius:24px;background:#fff;font-size:clamp(40px,5vw,54px);color:var(--ink);box-shadow:0 6px 0 #d7c9f5;display:flex;flex-direction:column;align-items:center;justify-content:center}
.opt svg{width:60%;height:60%}
.opt small{font-size:16px}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #d7c9f5}
.opt.right{background:var(--mint);color:#fff}
.opt.wrong{background:var(--bad);color:#fff}
.tip{margin:0;text-align:center;color:var(--muted);font-family:var(--body);font-weight:700;font-size:16px}
.tbar.small{flex:none;height:14px}

/* game 4: balloons */
.st-balloon{background:linear-gradient(#7fd0ff,#d6f1ff)}
.bl{flex:1;display:grid;grid-template-columns:minmax(220px,36%) 1fr;min-height:0}
.clockbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;background:rgba(255,255,255,.55)}
.cbq{font-size:clamp(22px,3vw,32px);text-align:center}
.cbc{width:min(100%,280px)}
.cbc .clk{width:100%;height:auto;display:block}
.bigtime{font-size:clamp(56px,9vw,96px);color:var(--ink);background:#fff;border-radius:26px;padding:.1em .5em;box-shadow:0 6px 0 rgba(0,0,0,.15);text-align:center;white-space:nowrap}
.sky{position:relative;overflow:hidden}
.sky::before{content:"☁️";font-family:var(--emo);position:absolute;font-size:80px;top:12%;left:8%;opacity:.8}
.sky::after{content:"☁️";font-family:var(--emo);position:absolute;font-size:60px;top:46%;right:6%;opacity:.7}
.balloon{position:absolute;top:0;width:clamp(104px,26%,160px);aspect-ratio:.84;border:0;padding:0;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.75) 0 8%, transparent 9%),var(--bc);
  border-radius:50% 50% 47% 47%/56% 56% 44% 44%;display:grid;place-items:center;font-size:clamp(24px,3.2vw,34px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);will-change:transform;z-index:2}
.balloon::after{content:"";position:absolute;bottom:-40px;left:50%;width:2px;height:40px;background:rgba(36,24,77,.45)}
.balloon::before{content:"";position:absolute;bottom:-7px;left:calc(50% - 7px);border:7px solid transparent;border-bottom-color:var(--bc);transform:rotate(180deg) translateY(-7px)}
.balloon .clk{width:80%;height:auto}
.balloon.pop{animation:popb .25s forwards;pointer-events:none}
.balloon.fly{transition:transform .8s ease-in;pointer-events:none}

/* game 5: train */
.st-train{background:linear-gradient(#fff3c4,#ffe08a)}
.tr{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px;min-height:0}
.tq{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:20px;padding:8px 14px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.tq p{margin:0;font-size:clamp(22px,3vw,32px)}
.tq b{font-weight:400;color:var(--pink-d)}
.tbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0}

<script>
(function(){
'use strict';
const app=document.getElementById('app');
const KEY='shape-clock-guard-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
const S=Object.assign({stars:{},best:{},name:'',sound:true,music:true,voice:true,voiceName:''},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=(s,r)=> (r||document).querySelector(s);
const $$=(s,r)=> Array.from((r||document).querySelectorAll(s));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const center=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};

/* ---------- timers per screen ---------- */
let T={to:[],iv:[]},alive=0;
function later(fn,ms){const id=setTimeout(fn,ms);T.to.push(id);return id}
function every(fn,ms){const id=setInterval(fn,ms);T.iv.push(id);return id}
function loop(fn){const token=alive;let last=performance.now();function f(now){if(token!==alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(fn(dt)!==false)requestAnimationFrame(f)}requestAnimationFrame(f)}
function clearAll(){alive++;T.to.forEach(clearTimeout);T.iv.forEach(clearInterval);T={to:[],iv:[]};hush();document.onkeydown=null}
function view(html){clearAll();app.innerHTML=html;app.scrollTop=0}

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function playAt(f,d,t,type,vol,slide){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}
function osc(f,d,delay,type,vol,slide){if(!S.sound)return;const a=ac();if(!a)return;try{playAt(f,d,a.currentTime+(delay||0),type,vol,slide)}catch(e){}}
const sfx={
  tap(){osc(660,.05,0,'sine',.08)},
  ok(c){const f=523*Math.pow(2,Math.min(c,12)/12);osc(f,.1,0,'triangle',.17);osc(f*1.5,.18,.07,'triangle',.15)},
  bad(){osc(240,.3,0,'sawtooth',.07,.55)},
  coin(){osc(988,.07,0,'square',.06);osc(1319,.2,.07,'square',.06)},
  star(i){osc([784,988,1175][i],.4,0,'triangle',.2);osc([1568,1976,2349][i],.2,.05,'sine',.06)},
  fever(){[523,659,784,1047,1319,1568].forEach((f,k)=>osc(f,.12,k*.06,'square',.06))},
  count(){osc(440,.14,0,'square',.07)},go(){osc(880,.4,0,'square',.08)},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,k)=>osc(f,.22,k*.11,'triangle',.16))},
  lose(){[392,349,311,262].forEach((f,k)=>osc(f,.28,k*.17,'triangle',.13))},
  hit(){osc(160,.3,0,'square',.1,.3)},zap(){osc(1400,.35,0,'sawtooth',.06,.2);osc(700,.35,.05,'square',.05,.3)},
  pop(){osc(700,.09,0,'square',.07,.4)},swoosh(){osc(300,.25,0,'sine',.06,3)}
};
const mf=n=>440*Math.pow(2,(n-69)/12);
const TR={
  map:{st:.17,mel:[72,0,76,0,79,0,76,0,74,0,77,0,81,0,77,0,76,0,79,0,84,0,79,0,77,0,74,0,72,0,0,0],bass:[48,48,53,53,55,55,48,48]},
  game:{st:.12,mel:[76,79,84,79,76,79,84,88,77,81,84,81,77,81,86,84,79,83,86,83,79,83,86,91,88,0,84,0,79,0,76,0],bass:[48,48,53,53,55,55,48,43]},
  boss:{st:.13,mel:[69,0,72,69,76,0,75,76,69,0,72,69,77,76,74,72,65,0,69,65,72,0,71,72,64,0,68,71,76,0,0,0],bass:[45,45,41,41,40,40,40,40]}
};
let bgmWant=null,bgmT=null,bgmNext=0,bgmI=0;
function bgm(n){if(n!==undefined){if(n===bgmWant&&bgmT)return;bgmWant=n}stopBgm();if(!S.music||!bgmWant)return;const a=ac();if(!a)return;const tr=TR[bgmWant];bgmI=0;bgmNext=a.currentTime+.08;
  bgmT=setInterval(()=>{if(!AC)return;if(bgmNext<AC.currentTime-.1)bgmNext=AC.currentTime+.05;while(bgmNext<AC.currentTime+.3){const i=bgmI%tr.mel.length,m=tr.mel[i];try{if(m)playAt(mf(m),tr.st*.85,bgmNext,'square',.028);if(i%4===0)playAt(mf(tr.bass[i/4]),tr.st*3.5,bgmNext,'triangle',.075)}catch(e){}bgmNext+=tr.st;bgmI++}},80)}
function stopBgm(){if(bgmT){clearInterval(bgmT);bgmT=null}}

/* ---------- voice ---------- */
const hasTTS='speechSynthesis' in window;let KOV=null,KOVS=[];
function vScore(v){const n=v.name;let s=0;if(/natural|online|neural/i.test(n))s+=10;if(/premium|enhanced|향상/i.test(n))s+=8;if(/google/i.test(n))s+=6;if(/sunhi|yuna|heami|seoyeon|jimin|female|여/i.test(n))s+=2;if(v.localService===false)s+=1;return s}
function fillVoices(){const sel=document.getElementById('o-vname');if(!sel)return;sel.innerHTML=KOVS.length?KOVS.map(v=>`<option value="${esc(v.name)}"${KOV&&v.name===KOV.name?' selected':''}>${esc(v.name.replace(/^(Microsoft|Google) /,''))}${vScore(v)>=6?' ⭐':''}</option>`).join(''):'<option value="">한국어 목소리가 없어요</option>'}
function pickVoice(){try{KOVS=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a));KOV=KOVS.find(v=>v.name===S.voiceName)||KOVS[0]||null;fillVoices()}catch(e){}}
if(hasTTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
const PITCH={tok:1.08,nemo:1,semo:1.04,dong:1.12,boss:.88,bossNice:.95};
function clean(t){return String(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍◀▶↔✔]/gu,'').replace(/~/g,'').replace(/…/g,', ').replace(/!{2,}/g,'!').replace(/\s+/g,' ').trim()}
let spkT=null;
function speak(t,force,who){if(!hasTTS||!(S.voice||force))return;try{speechSynthesis.cancel();clearTimeout(spkT);const text=clean(t);spkT=setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';if(KOV)u.voice=KOV;u.rate=who==='boss'?.92:.97;u.pitch=PITCH[who]||1.02;speechSynthesis.speak(u)}catch(e){}},90)}catch(e){}}
function hush(){clearTimeout(spkT);if(hasTTS)try{speechSynthesis.cancel()}catch(e){}}

/* ---------- effects ---------- */

function burst(x,y,n){n=n||16;for(let i=0;i<n;i++){const p=document.createElement('i');p.className='spark';const a=Math.PI*2*i/n+Math.random()*.4,d=50+Math.random()*80;p.style.left=x+'px';p.style.top=y+'px';p.style.background=pick(SPARK);p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),720)}}
function confetti(n){n=n||80;for(let i=0;i<n;i++){const p=document.createElement('i');p.className='conf';p.style.left=Math.random()*100+'vw';p.style.background=pick(SPARK);p.style.animationDuration=(2+Math.random()*2.2)+'s';p.style.animationDelay=Math.random()*.8+'s';if(Math.random()<.4)p.style.borderRadius='50%';document.body.appendChild(p);setTimeout(()=>p.remove(),5200)}}

function shapeSVG(t,c,o){o=o||{};c=c||SC[t];const v=o.v||0,rot=o.rot||0;let s;
  if(t==='sq'){const d=[[70,70],[86,52],[52,86]][v%3];s=`<rect x="${50-d[0]/2}" y="${50-d[1]/2}" width="${d[0]}" height="${d[1]}" rx="3"/>`}
  else if(t==='tri'){s=`<polygon points="${['50,10 92,84 8,84','16,12 16,86 88,86','6,76 94,76 34,20'][v%3]}"/>`}
  else s=`<circle cx="50" cy="50" r="38"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${rot} 50 50)" fill="${c}" stroke="rgba(36,24,77,.85)" stroke-width="4" stroke-linejoin="round">${s}</g></svg>`}
function objHTML(t,kind){const emo=kind?kind==='emo':Math.random()<.5;return emo?`<span class="emo">${pick(OBJ[t])}</span>`:shapeSVG(t,pick(PAL),{v:rnd(0,2),rot:t==='cir'?0:pick([0,0,0,15,-20,30])})}
function clockSVG(h,m,o){o=o||{};const ha=o.swap?0:((h%12)+m/60)*30,ma=o.swap?(h%12)*30:m*6;
  let s=`<svg class="clk" viewBox="-55 -55 110 110" aria-label="${o.swap?'시계':h+'시 '+(m?m+'분':'')}"><circle r="52" fill="#ffcf3a" stroke="#c98a00" stroke-width="3"/><circle r="45" fill="#fffdf6"/>`;
  for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?41:38.5;s+=`<line x1="${(Math.sin(a)*r1).toFixed(2)}" y1="${(-Math.cos(a)*r1).toFixed(2)}" x2="${(Math.sin(a)*43.5).toFixed(2)}" y2="${(-Math.cos(a)*43.5).toFixed(2)}" stroke="#9a8fc0" stroke-width="${i%5?1:2}"/>`}
  for(let n=1;n<=12;n++){const a=n*Math.PI/6;s+=`<text x="${(Math.sin(a)*31).toFixed(2)}" y="${(-Math.cos(a)*31+.5).toFixed(2)}" font-family="Jua,sans-serif" font-size="12" fill="#24184d" text-anchor="middle" dominant-baseline="central">${n}</text>`}
  const hx=Math.sin(ha*Math.PI/180),hy=-Math.cos(ha*Math.PI/180),mx=Math.sin(ma*Math.PI/180),my=-Math.cos(ma*Math.PI/180);
  s+=`<line x1="0" y1="0" x2="${(mx*35).toFixed(2)}" y2="${(my*35).toFixed(2)}" stroke="#2f7bff" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<line x1="0" y1="0" x2="${(hx*21).toFixed(2)}" y2="${(hy*21).toFixed(2)}" stroke="#ff4d4d" stroke-width="7" stroke-linecap="round"/>`;
  return s+`<circle r="4.5" fill="#24184d"/></svg>`}

  const face=nice?eyes(40,60,54,7)+mouth(50,67,9)+blush(30,64)+blush(70,64)

function makeGame(root,o){

    <div class="stage ${o.cls||''}"><div class="fever-badge">🔥 피버 타임! 점수 ×2</div></div>`;
  const g={score:0,combo:0,maxCombo:0,right:0,wrong:0,hearts:o.hearts||0,fever:0,stage:$('.stage',root)};
  const scoreEl=$('.score',root),comboEl=$('.combo',root),heartsEl=$('.hearts',root);
  g.setHearts=()=>{if(heartsEl)heartsEl.innerHTML='❤️'.repeat(g.hearts)+'🤍'.repeat(Math.max(0,o.hearts-g.hearts))};g.setHearts();
  g.setProg=i=>$$('.prog i',root).forEach((e,k)=>e.classList.toggle('cur',k===i));
  g.mark=(i,ok)=>{const e=$$('.prog i',root)[i];if(e){e.classList.remove('cur');e.classList.add(ok?'ok':'no')}};
  g.setTime=(t,tot)=>{const b=$('.tbar',root);if(!b)return;b.querySelector('i').style.width=Math.max(0,t/tot*100)+'%';b.querySelector('b').textContent=Math.ceil(Math.max(0,t))+'초';b.classList.toggle('low',t<8)};
  g.add=p=>{g.score+=p;scoreEl.textContent=g.score;scoreEl.classList.remove('bump');void scoreEl.offsetWidth;scoreEl.classList.add('bump')};
  g.ok=(x,y,base)=>{g.combo++;g.right++;g.maxCombo=Math.max(g.maxCombo,g.combo);const mul=g.fever>0?2:1,pts=((base||10)+Math.min(g.combo-1,10)*5)*mul;g.add(pts);
    fx(x,y,'+'+pts,mul>1?'gold big':'gold');burst(x,y,g.combo>=5?26:16);sfx.ok(g.combo);
    comboEl.textContent=g.combo>=2?'🔥 '+g.combo+' 콤보':'';comboEl.classList.remove('bump');void comboEl.offsetWidth;comboEl.classList.add('bump');
    if(g.combo%5===0)g.startFever();else if(g.combo>=2)praise(g.combo<PRAISE.length?PRAISE[g.combo]:pick(PRAISE_HI));return pts};
  g.no=(x,y,hurt)=>{g.combo=0;g.wrong++;comboEl.textContent='';sfx.bad();fx(x,y,'앗!','bad');shake(g.stage);
    if(hurt&&o.hearts){g.hearts=Math.max(0,g.hearts-1);g.setHearts();heartsEl.classList.remove('hurt');void heartsEl.offsetWidth;heartsEl.classList.add('hurt')}};
  g.startFever=()=>{const was=g.fever>0;g.fever=8;g.stage.classList.add('fever');if(!was){sfx.fever();praise('피버 타임!')}};
  every(()=>{if(g.fever>0){g.fever-=.25;if(g.fever<=0)g.stage.classList.remove('fever')}},250);

    g.stage.appendChild(ov);const txt=info.title+'. '+info.rules.join(' ');speak(txt,false,'tok');
    $('[data-say]',ov).onclick=()=>speak(txt,true,'tok');
    $('[data-go]',ov).onclick=()=>{hush();ov.innerHTML='<div class="count">3</div>';let n=3;sfx.count();

        else{ov.remove();start()}};later(step,700)}};
  return g;
}

  g.stage.insertAdjacentHTML('beforeend',`<div class="fd"><div class="target"><span class="t-ic"></span><b class="t-tx">어떤 모양일까?</b><button class="say-btn" type="button" aria-label="다시 듣기">🔊</button></div><div class="holes">${'<div class="hole"></div>'.repeat(12)}</div></div>`);

  let target=pick(TYPES),time=TOT,tT=0,sp=0,over=false;
  const say=()=>`${NAME[target]} 모양을 찾아라!`;
  function setTarget(silent){$('.t-ic',tg).innerHTML=shapeSVG(target,SC[target]);$('.t-tx',tg).textContent=say();tg.classList.remove('swap');void tg.offsetWidth;tg.classList.add('swap');if(!silent){speak(say(),false,'nemo');sfx.swoosh()}}
  $('.say-btn',tg).onclick=()=>speak(say(),true,'nemo');
  setTarget(true);g.setTime(TOT,TOT);
  function spawn(){const free=holes.filter(h=>!h.firstChild);if(!free.length)return;const h=pick(free);
    const t=Math.random()<.5?target:pick(TYPES.filter(x=>x!==target));
    const b=document.createElement('button');b.type='button';b.className='item';b.innerHTML=objHTML(t);h.appendChild(b);
    let done=false;const kill=()=>{if(b.parentNode)b.remove()};
    b.onpointerdown=e=>{e.preventDefault();if(done||over)return;done=true;
      if(t===target){g.ok(e.clientX,e.clientY,10);b.classList.add('hit');later(kill,300)}
      else{g.no(e.clientX,e.clientY,false);b.classList.add('miss');later(kill,450)}};
    later(()=>{if(done)return;done=true;b.classList.add('out');later(kill,260)},(2.7-Math.min(.9,(TOT-time)*.025))*1000)}
  g.intro(ch.intro,()=>{setTarget();loop(dt=>{if(over)return false;time-=dt;g.setTime(time,TOT);tT+=dt;
    if(tT>=10&&time>2){tT=0;const prev=target;target=pick(TYPES.filter(x=>x!==prev));holes.forEach(h=>h.innerHTML='');setTarget()}
    sp-=dt;if(sp<=0){spawn();sp=g.fever>0?.5:.68}
    if(time<=0){over=true;endGame(ch,g,g.right>=18?3:g.right>=10?2:1);return false}})});
};
